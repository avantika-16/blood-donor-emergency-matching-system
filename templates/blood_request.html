<!DOCTYPE html>
<html>
<head>
    <title>Emergency Blood Request</title>
</head>

<body>

    <h1>Emergency Blood Request</h1>

    <form method="POST">

        <label>Hospital ID:</label>
        <input type="number" name="hospital_id" required>
        <br><br>

        <label>Blood Group:</label>
        <select name="blood_group" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
        <br><br>

        <label>Units Required:</label>
        <input type="number" name="units_required" min="1" required>
        <br><br>

        <label>Urgency:</label>
        <select name="urgency" required>
            <option value="">Select Urgency</option>
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Normal">Normal</option>
        </select>
        <br><br>

        <label>Required Date:</label>
        <input type="date" name="required_date" required>
        <br><br>

        <button type="submit">Create Blood Request</button>

    </form>

</body>
</html>
